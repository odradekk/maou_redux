# CI（issue #92 起；#302 补引擎；阶段 4 收尾改分层）。
#
# 分层的理由是一条实测：**一条变异条目的判定，只有在它的靶文件或守它的
# 测试变了的时候才可能翻。** 做 K16 时重跑 K11 那 960 条，得到的结论与上次
# 逐字相同——那是纯空转。而全量唯一能抓、按面跑抓不到的，是「改了公共底座
# 把别处的测试悄悄卸了武装」这类跨文件失效（#10 栽过）；它是慢积累的风险，
# 不是每次提交的风险。所以：
#
#   pull_request → pr           按**改动面**跑，目标 10 分钟以内。
#                               选择器拿不准就退回全量，最坏等于从前的行为。
#   push(master) → engineless   全库三项自检 + 跳过数守护 + 锚鉴别力全文量。
#                  engine       同上，带引擎，跳过数必须是 0。
#   手动         → mutation     全量变异。**不再挂自动触发**：阶段收口时在
#                               本机满速跑一次（16 核）比在 4 核 runner 上
#                               挂 100 分钟划算，这里只留一个随时可点的口子。
#
# 代价说清楚：**PR 绿不再等于全库绿。** 兜底是 master push——合并后几分钟内
# 就在同一份内容上跑全库。中间提交会被 concurrency 顶掉（`cancel-in-progress`
# 对 push 为 false 时，排队中的 run 会被后来者取代），所以真正被验证的是
# 每一串合并的**最终态**，这对兜底来说够用。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_mutation:
        description: '是否顺带跑全量变异（默认关，避免手动触发误跑 180 分钟任务）'
        type: boolean
        default: false

permissions:
  contents: read

# PR 连更时取消陈旧运行（旧运行的结果不再有信息量）；master push 不取消。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # —— PR 档：按改动面 ——
  #
  # 这里**没有**跳过数守护：它对着全量套件的基线核对，跑子集时数字必然对不
  # 上，会变成假红。那道守护留在 master push 的两个 job 里。
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 取回 master（选择器按 merge-base 定改动面，浅克隆算不出来）
        run: git fetch --no-tags origin +master:refs/remotes/origin/master
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 测试（按改动面选；选择器拿不准即退回全量）
        run: npm run test:related
      - name: 锚鉴别力（默认档只量未冻结文件——PR 新加的锚正好都在这里）
        run: node tools/trace-check.mjs --anchor-quality
      - name: ESLint（零警告，与本地三项自检同一标准）
        run: npx eslint . --max-warnings 0
      - name: Prettier（格式比对）
        run: npx prettier --check .

  # —— master push 档：全库 ——
  engineless:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 15 分钟在 #242（K11 莉莉，源码 25k 行 + 测试 8.4k 行）上被顶穿：两个
    # job 都在整 15 分钟被取消，engineless 已跑完测试、跳过数守护、锚质量、
    # ESLint，倒在最后一步 Prettier 上。超时是防挂死的上限，不是预算。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 测试（无引擎；spec 进日志，TAP 落盘供守护核对）
        run: npm run test:ci
      - name: 跳过数守护（引擎缺失的代价必须是看得见的数字）
        run: node tools/skip-count-check.mjs test-report.tap
      # 默认路径只量未冻结文件，好让内环不为存量付那 19s；代价是往**已冻结**
      # 的文件里塞 ENDIF 一类弱锚在默认路径上看不见。`--all` 是唯一重算存量
      # 并核对总基线的地方，所以它必须有一个自动执行点。
      - name: 锚鉴别力全文量（弱锚只减不增，核对总基线）
        run: node tools/trace-check.mjs --anchor-quality --all
      - name: ESLint（零警告，与本地三项自检同一标准）
        run: npx eslint . --max-warnings 0
      - name: Prettier（格式比对）
        run: npx prettier --check .

  engine:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-engine
      - name: 测试（有引擎；TAP 落盘供守护核对；#449 临时挂进程级诊断，定位挂死后随本任务移除）
        run: |
          set +e
          mkdir -p logs/449
          export NODE_OPTIONS="--report-on-signal --report-directory=$PWD/logs/449 ${NODE_OPTIONS:-}"
          npm run test:ci > logs/449/test-stdout.log 2>&1 &
          main_pid=$!

          last_size=0
          stall=0
          dumped=0
          while kill -0 "$main_pid" 2>/dev/null; do
            sleep 15
            size=$(stat -c%s logs/449/test-stdout.log 2>/dev/null || echo 0)
            if [ "$size" = "$last_size" ]; then
              stall=$((stall + 15))
            else
              stall=0
            fi
            last_size=$size
            if [ "$stall" -ge 90 ] && [ "$dumped" -eq 0 ]; then
              dumped=1
              {
                echo "=== 卡死快照 $(date -u +%FT%TZ)，已连续 ${stall}s 无输出增长 ==="
                echo "--- uptime / loadavg ---"
                uptime
                cat /proc/loadavg
                echo "--- free -h ---"
                free -h
                echo "--- ps auxf（进程树） ---"
                ps auxf
                echo "--- dmesg 尾部（OOM 排查） ---"
                sudo dmesg 2>/dev/null | tail -100
                # 只收集 main_pid 的后代进程：pgrep -f 按整条命令行子串匹配，
                # 会连带 sh -c "node tools/run-node.mjs ..." 这类命令行里
                # 恰好含 "node" 字样的普通 shell 一并选中；给它发 SIGUSR2 没有
                # 处理器，按默认处置直接终止（#449 定位过程中在 35427013360
                # 上实测踩中：npm error signal SIGUSR2，3 分半就假失败）。
                # 改成先收集后代 PID，再按 /proc/$pid/comm 精确等于 node 过滤，
                # 只对真正的 node 进程发信号。
                descendants="$main_pid"
                frontier="$main_pid"
                while [ -n "$frontier" ]; do
                  frontier=$(pgrep -P "$(echo "$frontier" | tr '\n' ',' | sed 's/,$//')" 2>/dev/null)
                  [ -z "$frontier" ] && break
                  descendants="$descendants
          $frontier"
                done
                for pid in $descendants; do
                  echo "--- /proc/$pid ---"
                  tr '\0' ' ' < /proc/$pid/cmdline 2>/dev/null; echo
                  cat /proc/$pid/status 2>/dev/null
                  echo -n "wchan: "; cat /proc/$pid/wchan 2>/dev/null; echo
                  echo "syscall:"; cat /proc/$pid/syscall 2>/dev/null
                  echo "stack:"; sudo cat /proc/$pid/stack 2>/dev/null
                  echo "fd:"; ls -l /proc/$pid/fd 2>/dev/null
                  if [ "$(cat /proc/$pid/comm 2>/dev/null)" = "node" ]; then
                    kill -USR2 "$pid" 2>/dev/null
                  fi
                done
                sleep 5
                echo "--- logs/449 生成的诊断报告 ---"
                ls -la logs/449
              } > logs/449/hang-snapshot.log 2>&1
            fi
          done
          wait "$main_pid"
          rc=$?
          cat logs/449/test-stdout.log
          echo "=== test:ci 退出码 $rc ==="
          exit $rc
      - name: 跳过数守护（引擎在场时只能是 0）
        run: >-
          node tools/skip-count-check.mjs test-report.tap
          --baseline test/engine-present-skip-baseline.txt
      - name: 上传诊断产物（#449；无论成败都传，便于卡死时事后核验）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-hang-diagnostics
          path: logs/449/**
          if-no-files-found: ignore
          retention-days: 7

  # 原生 Windows 开发环境：覆盖盘符、反斜杠、中文临时目录与进程树清理。
  windows:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 安装 Windows 开发依赖
        run: npm ci
      - uses: ./.github/actions/setup-engine
      - name: Windows 全库测试（带引擎）
        run: npm run test:ci
      - name: 引擎在场时跳过数必须为 0
        run: node tools/skip-count-check.mjs test-report.tap --baseline test/engine-present-skip-baseline.txt

  # —— 手动档：全量变异 ——
  #
  # 「验证其余检查器守得住」的检查器的执行层。条目表的三项结构检查
  # （--verify）是秒级的，已随 test/mutation-check.test.js 进上面几个 job。
  #
  # 只挂 workflow_dispatch：阶段收口时的正规跑法是在本机满速跑一次，这里留
  # 着是为了不必守着本机也能点一轮。--jobs 4 的依据是 runner 实测 4 核 /
  # 15Gi 内存 / 86G 空闲盘，而 --jobs 2 只用掉 1.5Gi 和 41% 盘。
  #
  # 残留守护与**检出基线**比对而非假设干净——裸检出可能带既有脏度（#96 的
  # dev-guides CRLF），守护证的是「变异逐字节还原」，不是「仓库本来干净」。
  mutation:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_mutation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-engine
      - name: 记录检出基线（裸检出未必干净，见 #96）
        run: git status --porcelain > /tmp/tree-before.txt
      - name: runner 规格（--jobs 的上限由内存定，不是由核数定）
        run: |
          nproc; free -h; df -h /
      - name: 变异全量（有引擎：拦截 N / 跳过 0 / 红 0 是唯一合格线）
        run: |
          set +e
          node tools/mutation-check.mjs --jobs 4
          rc=$?
          echo "=== 退出码 $rc ==="
          free -h
          df -h / "$RUNNER_TEMP"
          oom=$(sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -20)
          echo "${oom:-dmesg 里没有 OOM 记录（或读不到 dmesg）}"
          exit $rc
      - name: 工作树残留守护（变异必须逐字节还原：与检出基线比对）
        run: |
          git status --porcelain > /tmp/tree-after.txt
          if ! diff -u /tmp/tree-before.txt /tmp/tree-after.txt; then
            echo "变异运行后工作树相对检出基线有变化（diff 里 - 行是基线、+ 行是跑后）——变异没有逐字节还原"
            exit 1
          fi
          echo "工作树与检出基线一致（变异逐字节还原；基线自身的脏度不属于本守护的判定面）"
