# CI（issue #92 起；#302 补引擎；阶段 4 分层；#452 改回 PR 也跑全库）。
#
# 全库 npm test 本机带引擎实测 217 秒（199 个文件、5923 例），runner 上
# 单个任务 5 分钟内跑完。曾按改动面选测试（#256），实测最多省一半时间，
# 却让「PR 绿不等于全库绿」成为要额外解释的注意事项，#452 撤掉。现在：
#
#   pull_request   → engine / windows / static   与 master push 同一套全库检查
#   push(master)   → 上述三个 + engineless         无引擎全库，守跳过数基线
#
# 全量变异在 mutation.yml，只对打了 `phase-acceptance` 标签的阶段收尾 PR 跑。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# PR 连更时取消陈旧运行（旧运行的结果不再有信息量）；master push 不取消。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # —— 带引擎全库（PR 与 master push）——
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-engine
      - name: 测试（有引擎；TAP 落盘供跳过数检查核对）
        run: npm run test:ci
      - name: 跳过数检查（引擎在场时只能是 0）
        run: >-
          node tools/skip-count-check.mjs test-report.tap
          --baseline test/engine-present-skip-baseline.txt

  # 原生 Windows 开发环境：覆盖盘符、反斜杠、中文临时目录与进程树清理。
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 安装 Windows 开发依赖
        run: npm ci
      - uses: ./.github/actions/setup-engine
      - name: Windows 全库测试（带引擎）
        run: npm run test:ci
      - name: 引擎在场时跳过数必须为 0
        run: node tools/skip-count-check.mjs test-report.tap --baseline test/engine-present-skip-baseline.txt

  # —— 静态检查（PR 与 master push）——
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: ESLint（零警告，与本地三项自检同一标准）
        run: npx eslint . --max-warnings 0
      - name: Prettier（格式比对）
        run: npx prettier --check .
      # .kojo 检查（#891）：仓库里跟踪的 .kojo 逐个过 ere-game-builder 的口上
      # 检查器。判定在 tools/ere-game-builder/lib/kojo.js，这里只负责挑文件与
      # 传退出码——结构错误（拼错的键、重复的 acc、重名篇目）工具返回 1，
      # 这一步跟着红。文件暂时一个都没有时跳过，不让空目录报「没有 .kojo」。
      - name: .kojo 检查（口上文件的静默失效写法）
        run: |
          set -euo pipefail
          files=$(git ls-files '*.kojo')
          if [ -z "$files" ]; then
            echo '仓库里没有 .kojo 文件，跳过'
            exit 0
          fi
          while IFS= read -r file; do
            node tools/ere-game-builder/cli.mjs ere_check_kojo "$file"
          done <<< "$files"

  # —— 无引擎全库（只在 master push）——
  engineless:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 15 分钟在 #242（K11 莉莉，源码 25k 行 + 测试 8.4k 行）上被顶穿。超时是
    # 防挂死的上限，不是预算。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 测试（无引擎；spec 进日志，TAP 落盘供跳过数检查核对）
        run: npm run test:ci
      - name: 跳过数检查（引擎缺失的代价必须是看得见的数字）
        run: node tools/skip-count-check.mjs test-report.tap
