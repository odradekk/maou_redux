# CI（issue #92 起；#302 补引擎；阶段 4 分层；#452 改回 PR 也跑全库）。
#
# 全库 npm test 本机带引擎实测 217 秒（199 个文件、5923 例），runner 上
# 单个任务 5 分钟内跑完。曾按改动面选测试（#256），实测最多省一半时间，
# 却让「PR 绿不等于全库绿」成为要额外解释的注意事项，#452 撤掉。现在：
#
#   pull_request   → engine / windows / static   与 master push 同一套全库检查
#   push(master)   → 上述三个 + engineless         无引擎全库，守跳过数基线；锚点质量全文量
#   手动           → mutation                     全量变异（见文末说明）
#
# 九份输出比对样本随 engine 任务跑（每份约 1 秒），任一样本有未解释差异即红。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_mutation:
        description: '是否顺带跑全量变异（默认关，避免手动触发误跑 180 分钟任务）'
        type: boolean
        default: false

permissions:
  contents: read

# PR 连更时取消陈旧运行（旧运行的结果不再有信息量）；master push 不取消。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # —— 带引擎全库（PR 与 master push）——
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-engine
      - name: 测试（有引擎；TAP 落盘供跳过数检查核对）
        run: npm run test:ci
      - name: 跳过数检查（引擎在场时只能是 0）
        run: >-
          node tools/skip-count-check.mjs test-report.tap
          --baseline test/engine-present-skip-baseline.txt
      - name: 九份输出比对样本（未解释差异必须为 0）
        run: |
          for s in mainmenu-natural mainmenu-max saveload-natural saveload-max daycycle-natural daycycle-max train-natural train-upgrade sale-natural; do
            echo "=== 样本 $s ==="
            node tools/compare/cli.js --sample "$s" || exit 1
          done

  # 原生 Windows 开发环境：覆盖盘符、反斜杠、中文临时目录与进程树清理。
  windows:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 安装 Windows 开发依赖
        run: npm ci
      - uses: ./.github/actions/setup-engine
      - name: Windows 全库测试（带引擎）
        run: npm run test:ci
      - name: 引擎在场时跳过数必须为 0
        run: node tools/skip-count-check.mjs test-report.tap --baseline test/engine-present-skip-baseline.txt

  # —— 静态检查（PR 与 master push）——
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 锚点质量（默认范围只量未冻结文件，PR 新加的引用都在这里）
        run: node tools/trace-check.mjs --anchor-quality
      - name: ESLint（零警告，与本地三项自检同一标准）
        run: npx eslint . --max-warnings 0
      - name: Prettier（格式比对）
        run: npx prettier --check .

  # —— 无引擎全库（只在 master push）——
  engineless:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 15 分钟在 #242（K11 莉莉，源码 25k 行 + 测试 8.4k 行）上被顶穿。超时是
    # 防挂死的上限，不是预算。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 测试（无引擎；spec 进日志，TAP 落盘供跳过数检查核对）
        run: npm run test:ci
      - name: 跳过数检查（引擎缺失的代价必须是看得见的数字）
        run: node tools/skip-count-check.mjs test-report.tap
      # 默认路径只量未冻结文件；`--all` 是唯一重算存量并核对总基线的地方，
      # 所以它必须有一个自动执行点。
      - name: 锚点质量全文量（弱锚点只减不增，核对总基线）
        run: node tools/trace-check.mjs --anchor-quality --all

  # —— 手动档：全量变异 ——
  #
  # 「验证其余检查器守得住」的检查器的执行层。条目表的三项结构检查
  # （--verify）是秒级的，已随 test/mutation-check.test.js 进上面几个 job。
  #
  # 只挂 workflow_dispatch：阶段收口时的正规跑法是在本机满速跑一次，这里留
  # 着是为了不必守着本机也能点一轮。--jobs 4 的依据是 runner 实测 4 核 /
  # 15Gi 内存 / 86G 空闲盘，而 --jobs 2 只用掉 1.5Gi 和 41% 盘。
  #
  # 残留守护与**检出基线**比对而非假设干净——裸检出可能带既有脏度（#96 的
  # dev-guides CRLF），守护证的是「变异逐字节还原」，不是「仓库本来干净」。
  mutation:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_mutation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-engine
      - name: 记录检出基线（裸检出未必干净，见 #96）
        run: git status --porcelain > /tmp/tree-before.txt
      - name: runner 规格（--jobs 的上限由内存定，不是由核数定）
        run: |
          nproc; free -h; df -h /
      - name: 变异全量（有引擎：拦截 N / 跳过 0 / 红 0 是唯一合格线）
        run: |
          set +e
          node tools/mutation-check.mjs --jobs 4
          rc=$?
          echo "=== 退出码 $rc ==="
          free -h
          df -h / "$RUNNER_TEMP"
          oom=$(sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -20)
          echo "${oom:-dmesg 里没有 OOM 记录（或读不到 dmesg）}"
          exit $rc
      - name: 工作树残留守护（变异必须逐字节还原：与检出基线比对）
        run: |
          git status --porcelain > /tmp/tree-after.txt
          if ! diff -u /tmp/tree-before.txt /tmp/tree-after.txt; then
            echo "变异运行后工作树相对检出基线有变化（diff 里 - 行是基线、+ 行是跑后）——变异没有逐字节还原"
            exit 1
          fi
          echo "工作树与检出基线一致（变异逐字节还原；基线自身的脏度不属于本守护的判定面）"
