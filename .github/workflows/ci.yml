# CI（issue #92 起；#302 补引擎）：三项自检与变异检查在干净 Linux 上的
# 自动执行点。三个 job 的分工：
#
#   engineless —— 不放引擎。引擎比对用例整组跳过，跳过数由守护步对着
#     test/engine-skip-baseline.txt 核对，偏离即红：覆盖面的收缩必须是
#     一次有意识的提交。eslint / prettier 也在这里。
#   engine ——  装引擎（release 资产，见 .github/actions/setup-engine）。
#     跳过数必须是 0：引擎在场却仍有东西被跳过，说明门控写错或 asar 没被
#     locate_asar 认出来。
#   mutation —— 装引擎跑全量变异。「全部拦下、零跳过、零红」这条严标准
#     自 #302 起有了自动执行点，不再只存在于派单人的本机。
#
# 仓库公开后标准 runner 分钟数免费不限量，所以全量变异挂在 pull_request 上
# 而不是只挂 master push——#302 之前它只在 master push 上跑，而那一档因为
# concurrency 秒级取消从来没成功过（40 次里 11 cancelled / 8 failure / 0 成功）。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# PR 连更时取消陈旧运行（旧运行的结果不再有信息量）；**master push 不取消**
# ——合并态的全量变异挂在它上面，被后一次 push 掐掉等于那一档从没跑过。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engineless:
    runs-on: ubuntu-latest
    # 15 分钟在 #242（K11 莉莉，源码 25k 行 + 测试 8.4k 行）上被顶穿：两个
    # job 都在整 15 分钟被取消，engineless 已跑完测试、跳过数守护、锚质量、
    # ESLint，倒在最后一步 Prettier 上。超时是防挂死的上限，不是预算——
    # 每张口上票都在把仓库做大，这个数会需要再抬。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 测试（无引擎；spec 进日志，TAP 落盘供守护核对）
        run: npm run test:ci
      - name: 跳过数守护（引擎缺失的代价必须是看得见的数字）
        run: node tools/skip-count-check.mjs test-report.tap
      # 锚鉴别力全文量（#298）：默认路径只量未冻结文件，好让本机内环不为
      # 存量付那 19s；代价是往**已冻结**的文件里塞 ENDIF 一类弱锚在默认路径
      # 上看不见。`--all` 是唯一重算存量并核对总基线的地方，所以它必须有一个
      # 自动执行点，否则「只减不增」就只是一句写在常量注释里的话。本机 13s。
      - name: 锚鉴别力全文量（弱锚只减不增，核对总基线）
        run: node tools/trace-check.mjs --anchor-quality --all
      - name: ESLint（零警告，与本地三项自检同一标准）
        run: npx eslint . --max-warnings 0
      - name: Prettier（格式比对）
        run: npx prettier --check .

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-engine
      - name: 测试（有引擎；TAP 落盘供守护核对）
        run: npm run test:ci
      - name: 跳过数守护（引擎在场时只能是 0）
        run: >-
          node tools/skip-count-check.mjs test-report.tap
          --baseline test/engine-present-skip-baseline.txt

  # 变异检查（#89）：「验证其余检查器守得住」的检查器的执行层。条目表的
  # 三项结构检查（--verify）是秒级的，已随 test/mutation-check.test.js 进
  # 上面两个 job 的 npm test；本 job 跑的是真执行全量。
  #
  # --jobs N 用隔离临时副本并行，主树不写。残留守护与**检出基线**比对而非
  # 假设干净——裸检出可能带既有脏度（#96 的 dev-guides CRLF），守护证的是
  # 「变异逐字节还原」，不是「仓库本来干净」。
  #
  # 超时按实测定：条目表 1270 条、本机 4 核约 1740s（且随每张口上票增长）；
  # 超时是防挂死的上限，不是预算：条目表每张口上票都在涨，runner 快慢也差得多。
  # 工具零第三方依赖，无需 npm ci。
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-engine
      - name: 记录检出基线（裸检出未必干净，见 #96）
        run: git status --porcelain > /tmp/tree-before.txt
      - name: runner 规格（--jobs 的上限由内存定，不是由核数定）
        run: |
          nproc; free -h; df -h /
      # --jobs 4：runner 实测 4 核 / 15Gi 内存 / 86G 空闲盘，而 --jobs 2 只用掉
      # 1.5Gi 和 41% 盘——核没吃满。#324（K11）在 --jobs 2 下顶穿了 120 分钟
      # 上限，开到 4 是最便宜的那一档，上面那句「上限由内存定」有 15Gi 兜着。
      #
      # 并行此前在 CI 上「跑到一半神秘崩溃」，根因是 process.exit() 丢弃管道
      # 上排队未写完的 stdout（实测写 836038 字节后立即 exit，管道对端只收到
      # 65536 字节）——本机重定向到文件时 stdout 是同步写，所以复现不出来。
      # 报告路径改 process.exitCode 后即好，源码锁与 M2901 守着这条。
      #
      # 串行基准：1467 条条目 38m50s（PR #307）。runner 之间快慢差得不少
      # （同一个 engineless job 在两次运行里是 2m42s 与 4m32s），加上条目表
      # 每张口上票都在涨，所以超时给到 120 分钟——它是防挂死的上限，不是
      # 预算。下面的自诊断保留。
      - name: 变异全量（有引擎：拦截 N / 跳过 0 / 红 0 是唯一合格线）
        run: |
          set +e
          node tools/mutation-check.mjs --jobs 4
          rc=$?
          echo "=== 退出码 $rc ==="
          free -h
          df -h / "$RUNNER_TEMP"
          oom=$(sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -20)
          echo "${oom:-dmesg 里没有 OOM 记录（或读不到 dmesg）}"
          exit $rc
      - name: 工作树残留守护（变异必须逐字节还原：与检出基线比对）
        run: |
          git status --porcelain > /tmp/tree-after.txt
          if ! diff -u /tmp/tree-before.txt /tmp/tree-after.txt; then
            echo "变异运行后工作树相对检出基线有变化（diff 里 - 行是基线、+ 行是跑后）——变异没有逐字节还原"
            exit 1
          fi
          echo "工作树与检出基线一致（变异逐字节还原；基线自身的脏度不属于本守护的判定面）"
