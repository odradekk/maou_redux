# CI（issue #92 起；#302 补引擎）：三项自检与变异检查在干净 Linux 上的
# 自动执行点。三个 job 的分工：
#
#   engineless —— 不放引擎。引擎比对用例整组跳过，跳过数由守护步对着
#     test/engine-skip-baseline.txt 核对，偏离即红：覆盖面的收缩必须是
#     一次有意识的提交。eslint / prettier 也在这里。
#   engine ——  装引擎（release 资产，见 .github/actions/setup-engine）。
#     跳过数必须是 0：引擎在场却仍有东西被跳过，说明门控写错或 asar 没被
#     locate_asar 认出来。
#   mutation —— 装引擎跑全量变异。「全部拦下、零跳过、零红」这条严标准
#     自 #302 起有了自动执行点，不再只存在于派单人的本机。
#
# 仓库公开后标准 runner 分钟数免费不限量，所以全量变异挂在 pull_request 上
# 而不是只挂 master push——#302 之前它只在 master push 上跑，而那一档因为
# concurrency 秒级取消从来没成功过（40 次里 11 cancelled / 8 failure / 0 成功）。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# PR 连更时取消陈旧运行（旧运行的结果不再有信息量）；**master push 不取消**
# ——合并态的全量变异挂在它上面，被后一次 push 掐掉等于那一档从没跑过。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engineless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 测试（无引擎；spec 进日志，TAP 落盘供守护核对）
        run: npm run test:ci
      - name: 跳过数守护（引擎缺失的代价必须是看得见的数字）
        run: node tools/skip-count-check.mjs test-report.tap
      - name: ESLint（零警告，与本地三项自检同一标准）
        run: npx eslint . --max-warnings 0
      - name: Prettier（格式比对）
        run: npx prettier --check .

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-engine
      - name: 测试（有引擎；TAP 落盘供守护核对）
        run: npm run test:ci
      - name: 跳过数守护（引擎在场时只能是 0）
        run: >-
          node tools/skip-count-check.mjs test-report.tap
          --baseline test/engine-present-skip-baseline.txt

  # 变异检查（#89）：「验证其余检查器守得住」的检查器的执行层。条目表的
  # 三项结构检查（--verify）是秒级的，已随 test/mutation-check.test.js 进
  # 上面两个 job 的 npm test；本 job 跑的是真执行全量。
  #
  # --jobs N 用隔离临时副本并行，主树不写。残留守护与**检出基线**比对而非
  # 假设干净——裸检出可能带既有脏度（#96 的 dev-guides CRLF），守护证的是
  # 「变异逐字节还原」，不是「仓库本来干净」。
  #
  # 超时按实测定：条目表 1270 条、本机 4 核约 1740s（且随每张口上票增长）；
  # CI 上 --jobs 2 更慢，60 分钟是留了余量的上限，跑通后按实测收紧。
  # 工具零第三方依赖，无需 npm ci。
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-engine
      - name: 记录检出基线（裸检出未必干净，见 #96）
        run: git status --porcelain > /tmp/tree-before.txt
      - name: runner 规格（--jobs 的上限由内存定，不是由核数定）
        run: |
          nproc; free -h; df -h /
      # --jobs 2 而不是 4：#302 首跑用 4 在 17 分钟处被杀（日志在一条 ✓ 中途
      # 截断、随即 exit 1，是进程被杀的形态而非某条变异判红）。每个隔离副本
      # 自己还会按核数并发跑 node --test，4 副本 × 4 核 = 16 个 node，每个都
      # 要把 42 MB 的 asar 解析进内存——内存而不是 CPU 才是这里的约束。
      # 失败时自诊断：--jobs 4 与 --jobs 2 两次都在**一条 ✓ 输出中途截断、
      # 随即 exit 1**，没有汇总行也没有任何 ✗——那是进程被杀的形态，不是
      # 某条变异判红。两次截断点还不同（M351 / M886），所以也不是某条坏条目。
      # 下面这一步把退出码、内存、磁盘、内核 OOM 记录都打出来，下次失败
      # 直接有证据，不用再猜。
      - name: 变异全量（有引擎：拦截 N / 跳过 0 / 红 0 是唯一合格线）
        run: |
          set +e
          node tools/mutation-check.mjs --jobs 2
          rc=$?
          echo "=== 退出码 $rc ==="
          free -h
          df -h / "$RUNNER_TEMP"
          sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -20 \
            || echo "dmesg 里没有 OOM 记录（或读不到 dmesg）"
          exit $rc
      - name: 工作树残留守护（变异必须逐字节还原：与检出基线比对）
        run: |
          git status --porcelain > /tmp/tree-after.txt
          if ! diff -u /tmp/tree-before.txt /tmp/tree-after.txt; then
            echo "变异运行后工作树相对检出基线有变化（diff 里 - 行是基线、+ 行是跑后）——变异没有逐字节还原"
            exit 1
          fi
          echo "工作树与检出基线一致（变异逐字节还原；基线自身的脏度不属于本守护的判定面）"
