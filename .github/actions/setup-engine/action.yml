# 引擎 bundle 上 runner（issue #302）。
#
# 为什么是 release 资产而不是入库：app.asar 42 MB，提交进 git 会永久留在
# 历史里，且「ere-4.8.0-win-x64/ 不入库」是既有约定（AGENTS.md）。也不用
# actions/cache——7 天不命中就被驱逐，会把「有没有引擎」变成时红时绿。
#
# 为什么带 token 且走 gh：仓库转私有后，release 资产下载需要认证——
# 此前的无认证 curl 在仓库公开时成立，转私有当天起两平台 job 齐挂
# 404。github.token 按调用工作流的 permissions（contents: read）取权，
# fork PR 的只读 token 同样够用。经 gh release download 走 API 取资产：
# 它处理认证与到对象存储的重定向，绕开 curl 直连时 Authorization 头
# 跨域重定向的坑。
#
# SHA256 断言是引擎换版的公告点：换版时新开 tag 并改这里，diff 即公告。
name: 装引擎 bundle
description: 从 release 下载 app.asar、校验 SHA256、放进 locate_asar 的候选位

runs:
  using: composite
  steps:
    - name: 下载 app.asar 并校验
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ASAR_TAG: engine-4.8.0
        ASAR_SHA256: 98cbd808b08c5d675665c4581ee813ff106b1bba0225102ea2950507e89808ce
      run: |
        set -euo pipefail
        # 落到 ~/.era-engine/app.asar，即 locate_asar 的第 3 号候选，而**不是**
        # 设 ERE_ENGINE_ASAR（第 1 号候选）。理由是 M374 实测出来的：那条变异
        # 拆掉 `ERE_ENGINE_ASAR === 'none'` 这道开关，测试要能判红，前提是
        # 拆掉之后还能找到引擎。用环境变量时，子进程里的 none 覆盖掉它，其余
        # 候选在 CI 上一个都不存在 → 仍是无引擎 → 测试照过 → 变异漏网。
        # 放进第 3 号候选就与本机同构，那道开关才真的被守着。
        dest="$HOME/.era-engine/app.asar"
        mkdir -p "$(dirname "$dest")"
        gh release download "$ASAR_TAG" --repo odradekk/maou_redux --pattern 'app.asar' --output "$dest"
        echo "$ASAR_SHA256  $dest" | sha256sum -c -
        echo "引擎就位：$dest（locate_asar 第 3 号候选）"
