# 转换自 GameBase.csv（tools/csv-to-yml.js，issue #17）
# 本文件归人工维护：转换器重跑默认不覆盖，需要重新生成请加 --force
#
# 版本轴自 #135 起另起（决议 ADR-0006，决策票 #104）：移植版的进度与原作
# 版本（93106）脱钩，不再沿用。起点是 0.0.1，不是 0.0.0——#135 定的 0.0.0
# 在引擎侧不可用：【版本】= 0 时 loadData 的闸门 `r.version && !(r.version <
# allowVersion)` 把 0 当 falsy 短路，任何存档都进不了版本比较、直接报
# 「saveN.sav 版本过低（0）！」（对照 loadGlobal 用 undefined 判空、0 能过
# ——两处闸门写法不一致，勘误与守卫见 ADR-0006 与 test/extalent-table.test.js）。
# 故【版本】最小可用值是 1。编码规则：【版本】（Number）=
# major×1000000 + minor×1000 + patch，即 0.0.1 → 1、0.1.0 → 1000；
# 【最低支持版本】恒等于【版本】（同抬同落）；【版本代号】是 String、纯显示，
# 标题画面直接读它（ere/page/page-title.js）。破坏性改动判定表见 ADR-0006。
# 【游戏标识】931060 冻结：与 sav/global.sav 的 code 一致引擎才启动，改它
# 会拒绝启动并报错；其命名理由（原版本号加一位后缀）已随版本轴改动失效，
# 但取值不动。
#
# 0.0.1（#138）：三条理由。其一，破坏性改动两条命中（ADR-0006 判定表）——
# extendedCharaTables 加 EX_TALENT 表（fillData 死分支不补齐）与常规批
# 27 张角色预设入库（预设内容变更）。其二，离开不可用的 0 值区间（上文
# loadData 的 truthy 短路）。旧档（0.0.0）本就读不回（同一短路），0.0.1 起
# 亦被【最低支持版本】= 1 拒收，废档处理。global.sav 的 code 未变，引擎
# 照常启动。
#
# 0.0.2（#188 验收补）：角色预设内容变更（ADR-0006 判定表命中）——鋭/蟻 两个
# 字种进归一表后重生成 Chara18/19/203，名前/呼び名 由「精鋭部队/精英蟻怪」
# 改为「精锐部队/精英蚁怪」。改的只是字形、语义未变，一度想按「非破坏性」
# 放过，但 ADR-0006 第 58 行事先驳回过这个口子：曾考虑给角色预设级开例外、
# **未取**，理由是「口子一开就要再判一条哪些算角色预设级的边界，判错的后果
# 是玩家拿着半迁移的档，比干脆废档更坏」。判据本身也直指本例——「该角色带
# 旧预设值，无人补正」：旧档里那三个角色的名字仍是繁体形，没有迁移代码去改。
#
# 0.0.3（#215 J5）：新增持久写入位属破坏性改动（ADR-0006 判定表）——服装
# 系统落地（ere/system/train/cloth.js）后 CFLAG:40-48 着衣位首次有了写入
# 路径（此前只有 #170 的 CM_CLOTH 写 41/45/46 三点）：AFTERTRAIN_CLOTH 会
# 按 TFLAG:45 的弄脏位**改写**旧档里已有的 41/42/43/46/47 值（丢弃→-2、
# 洗涤→2/3/5），旧档无人补正这些迁移语义；TEQUIP 的四个守卫位（45/55/89/90）
# 与跨域两段（22/35）同票开门面（桶随 beginTrain 建，不进存档）。
