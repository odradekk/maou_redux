# 本表由人工维护。
#
# 版本轴自 #135 起另起（决议 ADR-0006，决策票 #104）：进度与导入时的旧版
# 本号（93106）脱钩，不再沿用。起点是 0.0.1，不是 0.0.0——#135 定的 0.0.0
# 在引擎侧不可用：【版本】= 0 时 loadData 的闸门 `r.version && !(r.version <
# allowVersion)` 把 0 当 falsy 短路，任何存档都进不了版本比较、直接报
# 「saveN.sav 版本过低（0）！」（对照 loadGlobal 用 undefined 判空、0 能过
# ——两处闸门写法不一致，勘误与检查见 ADR-0006 与 test/extalent-table.test.js）。
# 故【版本】最小可用值是 1。编码规则：【版本】（Number）=
# major×1000000 + minor×1000 + patch，即 0.0.1 → 1、0.1.0 → 1000；
# 【最低支持版本】自 0.1.1 起固定在 1000（0.1.0），不再跟着【版本】一起提高——
# 0.1.0 已对外发布，已发布版本的存档必须能继续读取（ADR-0006「玩家存档保护」）；
# 【版本代号】是 String、纯显示，
# 标题画面直接读它（ere/page/page-title.js）。破坏性改动判定表见 ADR-0006。
# 引擎的提示按【版本】除以 1000 显示（1005 显示成 1.005），见 AGENTS.md「发版」。
# 【游戏标识】931060 冻结：与 sav/global.sav 的 code 一致引擎才启动，改它
# 会拒绝启动并报错。
#
# 0.0.1–0.0.8 各自为什么抬【最低支持版本】（每次的破坏性改动）记在
# CHANGELOG.md 的「开发版本（0.0.1–0.0.8）」一节；0.1.0 起的存档范围记在
# 各自的版本条目里。

# 【初始角色编号】= 0（魔王本人）：引擎按 nameMapping 映射成 defaultChara，
# resetData 末尾按该编号的预设自动建角色，标题页不再手工 addCharacter(0)
# （#848）。它同时是相性镜像的排除对象——引擎给一对相性写反向时判的是键的
# 目标号，目标恰是默认角色就不回写，故角色预设里不要给 0 号写【相性】
# （test/gamebase-default-chara.test.js 守着这一条）。
