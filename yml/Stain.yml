# 本文件为人工产出：STAIN 的名字表（身体部位的污垢位掩码，三段、按角色）。
#
# 内容：值是污渍类型的按位或——1 爱液 / 2 阴茎 / 4 精液 / 8 肛门。源码在用的
# 下标是 0-5 六个，其中 2 阴茎 / 3 阴道 / 5 胸部三个有名字来源（facade-names），
# 登记在本表；0 / 1 / 4 三个没有名字来源，随族票建模，本表不预先命名
# （test/train-table-names.test.js 把这份缺口钉成清单）。
#
# **这张表为什么非空**：与 TEquip 同一条机制——addCharacterForTrain 按
# `staticData.stain` 的声明集给每个入列角色预置 0：
#
#   ["tequip","tcvar","source","stain"].forEach(t => { ... this.data[t][e][r] = 0 ... })
#
# 位掩码的写法是「读（`|| 0`）→ 按位或 → 写回」（com-advanced.js 的
# `stain(player, 2) | 4`），写入侧自带默认值，所以登记**不改变任何数值**：它给
# 的是「这三个槽在入列角色身上一定存在且是数字」这层结构保证，以及按名寻址的
# 名字。位运算本身对 undefined 也不报错（`undefined | 4` = 4），这与 flag 侧
# `undefined + n` = NaN 的 add 是两回事。
#
# 边界：stain 桶与 tequip 一样由调教开始建、endTrain 整表删除，**不进存档**，
# 旧档没有需要补的键。
"阴茎污渍":
  id: 2
  name: "penis_stain"
  type: "number"
"阴道污渍":
  id: 3
  name: "vagina_stain"
  type: "number"
"胸部污渍":
  id: 5
  name: "breast_stain"
  type: "number"
