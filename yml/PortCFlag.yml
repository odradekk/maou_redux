# 移植角色旗标表（portcflag）：移植版自建的二维角色扩展表（issue #67，
# ADR-0001「新字段落在自造扩展表」的第一个实例）。这张表是移植工程的
# 自有数据，二次开发新增的按角色字段一律落此，不占既有表的空闲区段
# （空闲区段不可信，见 ADR-0001）。
#
# 二维生效靠登记：yml/_fixed.json 的 system.extendedCharaTables 含
# "portcflag"。引擎读表在先、按叶子键合并 _fixed.json 在前（app.asar 的
# syncConfig，fixed 赢），登记先于静态表装载——未登记的表会被引擎按一维
# 自动生效（extendedTables[name] = tableType.normal），后果：三段寻址的
# 角色桶永不创建、写入静默丢弃、角色数据表的预设行被装载循环跳过。
# test/portcflag-table.test.js 的登记契约锁钉住「表在场 ⇔ 已登记」。
#
# 字段形状与引擎自带转换器的产出一致（同 Base.yml 人工表先例）：
#   键    = 中文显示名（#5 决议三层命名的第一层）
#   name  = 英文 snake_case 标识符（JS 侧访问器名）
#   id    = 数字下标（底层寻址一律用它）
#
# 区段规划：0 起归移植自建字段；后续票据按域认领区段（同 CFLAG 的区段
# 所有权思路，#65/#70），不预先划段。
"数据版本":
  id: 0
  name: "data_version"
  type: "number"
  # 语义：该角色数据的移植版本。预设基线 0 = 移植起点的算法（现有角色
  # 预设按旧数据直接转换）；角色加入时由 ere/system/chara/chara-portcflag.js 盖当时的
  # PORT_DATA_VERSION。#135 起为诊断戳（ADR-0006）：无迁移消费者，读档后
  # 可辨别该角色由哪一版预设生成——引擎 addCharacter 只在加入时套预设、
  # 存档里的老角色永不刷新（yml/CFlag.yml 头注记录的引擎行为），预设演进
  # 按判定表属破坏性改动，抬版本废档处理，不据此补值。寻址示例：
  # era.get(`portcflag:17:数据版本`)——具名与序号（:0）同槽，引擎
  # staticData.portcflag 翻译。
"排序编号":
  id: 1
  name: "sort_number"
  type: "number"
  # 语义：角色在名册「编号」视图里的排列键（issue #545 返工，ADR-0001）。
  # 名册页 [1700] 的换号只交换两个角色的这个值——不搬任何角色数据、不改
  # 角色 ID（ID 即身份，见 issue #21）。0 = 未设，读取侧一律 `|| 角色 ID`
  # 回落，所以默认顺序与 ID 序一致；只有换过号的角色才带非 0 值。
  # 显示标准：屏幕上的编号格仍是角色 ID（引擎按 showAcc 拼的按钮快捷键），
  # 排序编号只决定行的先后，理由见 ere/page/page-chara-number-swap.js 文件头。
  # 随档往返：真引擎的写入 → saveData → loadData 往返由
  # test/portcflag-table.test.js 驱动引擎代码钉住；本字段另由
  # test/page-chara-info.test.js 的「排序编号随存档往返」用例覆盖。
"预设模板":
  id: 2
  name: "template_no"
  type: "number"
  # 语义：该角色由哪个预设（yml/Chara*.yml 的「番号」）生成（issue #884）。
  # 角色号是身份、预设号只决定初始数据，两者自本票起分开；需要预设号的代码
  # 一律读这个字段（ere/system/chara/chara-pregnancy.js 的 template_no_of），不再
  # 从角色号反推，也不再靠「来源预设各占一段 ID 区间」的编码在代码里解码。
  #
  # 写入点：角色文件每张预设都带一行「预设模板: 番号」，引擎 addCharacter
  # 把它抄进**目标角色**的桶——单号加入时目标号 = 预设号，双号写法
  # `addCharacter([目标号, 预设号])`（后代唯一的建角色写法）则抄的是源预设的
  # 值。因此后代不用另写一行代码，字段天然带来源预设号。
  #
  # 旧存档（0.1.0 起、本票之前）：没有这个字段。有预设的角色由引擎读档时的
  # fillData 按自己的预设补成预设号；后代的动态 ID 没有预设，补 0，再由读档
  # 钩子（ere/event/event-load.js）的补填按旧编码换算写入。两条路径都由
  # test/chara-template.test.js 驱动引擎代码钉住；ADR-0006 的判定见该文件
  # 头注与 PR 说明。
  #
  # 0 的语义：只有魔王（0 号）的预设号是 0，所以「0」在非 0 号角色上等于
  # 「还没写到」——读档补填据此判断要不要补，不用另设哨兵。
