# 本文件为人工产出：TEQUIP 的名字表（调教中的装具位，三段、按角色）。
#
# 内容：装具与情景的「装着」位——下标 = 装备编号（18 淋浴、21 媚药、22 利尿剂、
# 35/36/37 主人/助手/对象的避孕套、45 口塞、53 录像、55 死斗场、89 兽奸、
# 90 触手…）。中文键与 tools/facade-names.js 逐条一致，
# test/train-table-names.test.js 守着这一条。
#
# 建模范围是 #215（J5）名下的 15 个下标。源码里另有 11/13/14/15/16/17/19/43/
# 44/46/47/49/88/98 十四个照样在读写、但没有名字来源的位：它们随各自的族票
# 按 ownership/tequip-ownership.yml 建模，本表不预先命名（测试把这份缺口钉成
# 清单，新出现一个无名字的下标会当场红）。
#
# **这张表为什么非空**：空表本身够让引擎建出 staticData.tequip——三段寻址的
# 回落分支 `u = i(this.staticData[a][u], u)` 只要求名字表在场，缺位即抛错。
# 要登记的理由在 addCharacterForTrain：
#
#   ["tequip","tcvar","source","stain"].forEach(t => {
#     void 0 !== this.staticData[t] &&
#       Object.values(this.staticData[t]).forEach(r => this.data[t][e][r] = 0)
#   })
#
# **登记的序号就是每个入列角色开桶时预置 0 的集合**。表空时这些槽在第一次
# set 之前是 undefined，而 era.add 的累加分支会得到 `undefined + n` = NaN 并
# 静默写回。装具位眼下都写常量（装上 = 1、卸下 = 0）或走 `|| 0` 的读，
# **登记因此没有改变任何开/关判定**；真正改变行为的是口上那批把「未装着」
# 写成 `=== 0` / `== 0` 的守卫——它们从恒 false 变成按位判断（见下面 45 / 89 /
# 90 三条的注），那是登记要修的既有偏差：原作里 TEQUIP 由引擎按声明集预置 0。
#
# 边界：tequip 桶由 beginTrain/addCharacterForTrain 建、endTrain 整表删除，
# **不进存档**，旧档没有需要补的键。
