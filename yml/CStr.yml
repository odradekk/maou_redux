# 本文件为人工产出：CSTR 的名字表（角色预设与代码读写的字符串槽，三段、按角色）。
#
# 登记有三层作用，缺一不可：
#   1. 让引擎装载循环建出 staticData.cstr——三段寻址在 `data.cstr[角色]` 存在、
#      而 staticData.cstr 缺位时**直接抛错**（setVar 回落分支对 undefined 取
#      下标，实机撞见「Cannot read properties of undefined (reading '2')」）；
#   2. 让引擎把预设字串真正写进角色数据。addCharacter 只给名字表内登记的下标
#      建槽并抄预设，没登记的序号上的预设被静默丢弃——丽塔的 CSTR:31「我」与
#      嘉德、菲娅的 CSTR:60 预设此前都停在这一层；
#   3. 让 addCharacter 给每个新角色把这些槽预置成**空串**（cstr 是字符串表，
#      引擎在这一支用的是 `?? ""` 而不是数字表的 `?? 0`）：登记前这些序号在
#      新角色身上是 undefined。
#
# 收录判据（#830 起扩到整套有名字来源的槽）：凡是 facade-names 里具名的下标都
# 登记——它们正是代码按名读写的那批（1 加入时名字、2 孩子父亲、3/4 初体验与
# 初吻对象名、5 家人末路、6 录像标题、7 癖好/自由调教内容、99 故事名），加上
# 两条有非空预设的（31 旧位、60 自称）。只写不读、也没有名字来源的 cstr:30
# （处刑称号）不进本表，随族票命名。
#
# 字段形状与引擎自带转换器的产出一致（同 Base.yml / PortCFlag.yml 先例）：
#   键    = 中文显示名
#   name  = 英文 snake_case 标识符（JS 侧访问器名）
#   id    = 数字下标
#   type  = 值类型（本表全是字符串）
#
# 读档影响：fillData 的 cstr 分支写成 `this.data.cstr || (…)`——只有当存档完全
# 没有 cstr 桶时才进得去，而 cstr 桶在角色加入时由 addCharacter 建过，所以
# **读档不会给已加入的角色补这些槽**；即便进了那一段，它把预设路径拼成了
# `<角色>.chara.<下标>`（角色预设的实际形状是 `<角色>.cstr.<下标>`，引擎里的
# 笔误），补进去的也是空串。结论：登记只影响**新加入的角色**；旧存档（含
# 0.1.0）里已加入的角色读到 undefined，门面 getter 与读取侧都按 `|| ''` /
# 真假判断用，与空串同值。
# —— 代码按名读写的八条（#830 登记） ——
"加入时名字":
  id: 1
  name: "joined_name"
  type: "string"
"孩子父亲名字":
  id: 2
  name: "child_father_name"
  type: "string"
"初体验对象名":
  id: 3
  name: "first_sex_partner_name"
  type: "string"
"初吻对象名":
  id: 4
  name: "first_kiss_partner_name"
  type: "string"
"家人末路":
  id: 5
  name: "family_fate"
  type: "string"
"录像标题":
  id: 6
  name: "video_title"
  type: "string"
"自由调教内容":
  id: 7
  name: "free_train_content"
  type: "string"
"故事名":
  id: 99
  name: "story_name"
  type: "string"
# —— 角色预设在用的两条 ——
"自称（旧位）":
  id: 31
  name: "self_call_legacy"
  type: "string"
  # 丽塔（223）的角色文件把「我」写在这里，注释标的是「第一人称」；游戏侧读
  # 自称一律读 60 号，31 号全库没有读点，登记是为了让她的预设落库、序号可按名
  # 寻址。
"自称":
  id: 60
  name: "self_call"
  type: "string"
  # %SELF_CALL% 的取值源：非空则用它，否则回落「我」；口上的一人称就是指它。
  # 加载后的一人称初始化会按一人称档位（CFLAG:450）重设，档位为 0 的角色会被
  # 直接写成「我」，此时预设只在一人称初始化之前可见。
