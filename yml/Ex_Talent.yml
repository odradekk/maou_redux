# EX_TALENT 名字表（issue #138 建表，issue #834 补名字）：魔改版从原版 TALENT
# 移出的独有素质（`#DIM SAVEDATA CHARADATA EX_TALENT,1000`，按角色、1000 槽，
# 全库用量 163 次——#105 决议第三节）。本文件为人工产出（CFlag.yml 同款先例）。
#
# 二维生效靠登记：yml/_fixed.json 的 system.extendedCharaTables 含
# "ex_talent"（注意下划线——文件名小写即表名，寻址 `ex_talent:角色:序号`）。
# 登记与表在场的双向契约由 test/extalent-table.test.js 钉住（portcflag 的同款
# 实害：登记了没表 → addCharacter 建顶层桶时直接崩；有表没登记 → 引擎按一维
# 自动生效，角色桶永不建、写入静默丢弃）。
#
# 字段形状与引擎自带转换器的产出一致（同 CFlag.yml / PortCFlag.yml 先例）：
#   键    = 中文显示名（素质列表、日常类型等显示点的文案来源）
#   name  = 英文 snake_case 标识符（JS 侧访问器名，#820 的结论）
#   id    = 数字下标，沿用原版序号（底层寻址一律用它）
#   type  = 值类型（本表全是整数）
#
# 条目有两个作用，缺一不可：
#   1. 显示名：`ex_talentname:序号` 由引擎从这份名单取值，JS 侧不再有运行时
#      名字表（chara-ex.js 的 ex_talentname 只判未登记，名字转查引擎）；
#   2. 角色预设：角色文件（yml/Chara*.yml）的「ex_talent」段要落进 data，下标
#      必须在名字表内——addCharacter 与读档后的 fillData 都只处理名字表登记的
#      序号，没登记的预设行整行丢弃（引擎 initCharaTable 的分支外没有第二条路）。
#
# **登记会改变初值语义**（yml/CStr.yml 头注的同一件事）：登记过的序号在角色
# 加入与读档时被预置成「角色预设值，没有预设补 0」。所以登记集取「全库实际
# 用到的 17 个」，不是「101-800 全段」——空位保持未声明，`era.get` 继续返回
# undefined，而所有消费者的判定都是真值判断，0 与 undefined 同结论。序号一旦
# 登记就不要删：删了旧档里那批槽会停在原值（CFlag.yml 头注的同款约定）。
#
# 读档补齐（引擎 5.0.0）：fillData 对每个已加入角色重建扩展角色表的桶，**已有
# 值不覆盖**（`桶[序号] ??= 预设`），缺的键按角色预设补、没有预设补 0。「表晚于
# 存档出现」的旧档读进来也能写入。4.8.0 的重建条件写成拿表名字符串的下标去比
# tableType（恒假），那一版旧档缺的表补不上、写入静默丢弃——#13 当时据此把
# GameBase 抬到 0.0.1 废旧档，这条判定随 5.0.0 的修复失效（ADR-0006「引擎升级
# 到 5.0.0」一节：判定表第四行改判「否」）。两条行为都由
# test/extalent-table.test.js 用引擎自己的 addCharacter / fillData 钉住
# （portcflag-table.test.js 的同款用例）。

# 0-4：剧情标记（近卫、后代、替身一类）
"灵魂错位":
  id: 0
  name: "soul_misplaced"
  type: "number"
  # 值 = 错位等级（0 = 未错位），chara-soul-transfer.js 读写
"近卫":
  id: 1
  name: "royal_guard"
  type: "number"
  # 勇者的近卫血统标记，chara-pregnancy.js 写
