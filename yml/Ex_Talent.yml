# EX_TALENT 名字表（issue #138）：魔改版从原版 TALENT 移出的独有素质
# （`#DIM SAVEDATA CHARADATA EX_TALENT,1000`，按角色、1000 槽，全库用量
# 163 次——#105 决议第三节）。
#
# 本文件为人工产出（CFlag.yml 同款先例）：EX_TALENT 没有名称表。
# 它落的是 #105 决议「扩展角色表只加 EX_TALENT」——EX_CFLAG
# 全库用量仅 10，不值得为此再开一张扩展表，不加。
#
# 二维生效靠登记：yml/_fixed.json 的 system.extendedCharaTables 含
# "ex_talent"（注意下划线——文件名小写即表名，寻址 `ex_talent:角色:序号`，
# ere/system/chara/chara-ex.js 的九处写入用的就是这个前缀）。登记与表在场的双向
# 契约由 test/extalent-table.test.js 钉住（portcflag 的同款实害：登记了
# 没表 → addCharacter 建顶层桶时直接崩；有表没登记 → 引擎按一维自动生效，
# 角色桶永不建、写入静默丢弃）。
#
# 空表即够用：现有消费者（add_chara_ex 分发的八个实现，#21）一律用数字
# 下标寻址（200 魔王 / 101 琼 / 102 普林希斯 / 103 嘉德 / 104 菲娅 / 4+801+901
# 狂王替身 / 223 丽塔 / 777 卡拉），引擎 safeUndefinedCheck 在名字表查不到
# 时原样回落数字。名称条目（ex_talentname_init 的运行时初始化表）
# 随读档钩子票实现时在此补「名称: id」——补之前先看 yml/CStr.yml 头注的
# 警告：登记进名字表的序号会在角色加入与读档时被预置成 0，初值语义随之
# 改变。
#
# 读档补齐（引擎 5.0.0）：fillData 为每个已加入角色重建扩展角色表的桶，名字表
# 声明的字段按角色预设补、没有预设补 0，所以「表晚于存档出现」的旧档读进来
# 也能写入。4.8.0 的重建条件写成拿表名字符串的下标去比 tableType（恒假），
# 那一版旧档缺的表补不上、写入静默丢弃——#13 当时据此把 GameBase 抬到 0.0.1
# 废旧档，这条判定随 5.0.0 的修复失效（ADR-0006「引擎升级到 5.0.0」一节：
# 判定表第四行改判「否」）。行为由 test/extalent-table.test.js 用引擎自己的
# fillData 钉住（portcflag-table.test.js 的同款用例）。
