# 本文件为人工产出：TFLAG 的名字表（调教期的临时旗标，一维、非按角色）。
#
# 内容：一场调教里「这一回合发生过什么」的旗标与计数——射精与绝顶的种类、
# 刻印变动、珠结算快照、失神补丁的相位与快照。中文键与 tools/facade-names.js
# 逐条一致（全库 106 个下标都在那份命名表里，test/train-table-names.test.js
# 守着「两源一致」与「源码用到的序号都在这里」两条）。
#
# **这张表为什么非空**：空表只够让引擎建出 staticData.tflag——二段寻址在表名
# 属于内置表（embeddedTableNames 含 tflag）时走 `u = i(this.staticData[a][u], u)`，
# 名字表缺位即抛错。真正要登记的理由在 beginTrain：
#
#   void 0 !== this.staticData.tflag &&
#     Object.values(this.staticData.tflag).forEach(e => this.data.tflag[e] = 0)
#
# **登记的序号就是调教开始时预置 0 的集合**。表空时这些槽在第一次写之前是
# undefined，而 setVar 的累加分支是 `this.data[a][u] += t`：`undefined + 1` 得
# NaN 并静默写回，这一场调教里后来的读与写都在 NaN 上打转。TFLAG:30（主人
# 经验，全库十四处 add）与 TFLAG:402（死斗场收入，八处 add）此前就靠「同一场
# 里先有人 set 过同一格」才偶尔躲开 NaN；登记把这两处从 NaN 变成从 0 起算。
#
# 代价与边界：调教开始时 data.tflag 会多出这 106 格 0。tflag 由 beginTrain 建、
# endTrain 整表删除，**不进存档**——旧档（含 0.1.0）没有需要补的键，登记前后
# 存档形状不变。回合内唯一的可观察差异是上面那批 NaN 变成数值：读取侧一律
# `|| 0` 或真假/大小判断，undefined 与 0 在这两种写法下同值。
#
# 序号不做区间压缩：相邻序号在不同补丁里含义不同（864-898 是失神快照的逐项
# 记录，899 是失神本身），合并会丢掉「这一格是谁写的」。
# —— 射精与绝顶的种类旗标（0-32）：本回合发生过什么，公共文案与口上
#    按它分支；值多是「种类」或「次数/档位」，不是真假两态 ——
