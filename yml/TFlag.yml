# 本文件不是转换器产物：原作没有 TFLAG 的名字表（target/CSV 下无对应 CSV，
# 原作一律用数字下标），无从转换。
#
# 内容：调教中的临时旗标（一维，非按角色）。原作用满整个下标空间——0-30 每
# 选一次指令清零一次、34 录像、50-58 珠结算的快照、59 上次指令、201 同指令
# 连发抑制、402 死斗场收入、860 失神时的口上开关、899 失神、999 清除点行号。
#
# 它的存在只有一个目的：让引擎装载循环建出 `staticData.tflag`。**二段寻址
# 同样吃这张表**——引擎的 setVar 在表名属于内置表（embeddedTableNames 含
# tflag）时走 `u = i(this.staticData[a][u], u)`，名字表缺位即抛错。这一条
# 修正了 #13 的既有认知：二段寻址不是一律「静默创建」，`flag:*` 之所以静默
# 通过，是因为 Flag.yml 在；`tflag:*` 缺表就是硬崩。
#
# 空表即够用：下标是数字，引擎的 safeUndefinedCheck 在名字表查不到时原样
# 回落到该数字。
