# 全局变量表：global 表是公共存档 global.sav 的主体，引擎每次执行脚本前自动
# 加载、伴随特定存档自动保存（dev-guides/11-saves.md）。
#
# 字段形状与引擎自带转换器的产出一致（issue #13）：
#   键    = 中文显示名（#5 决议三层命名的第一层）
#   name  = 英文 snake_case 标识符（JS 侧访问器名）
#   id    = 数字下标，与 Emuera 原下标 1:1（底层寻址一律用它，#5 决议）
#
# 本表为人工产出（issue #18）：没有可直接转换的全局表来源，变量逐个登记。
# id 分配依据（issue #18 记录）：
#   命名变量在引擎侧按「名字」存取——旧版随包公共存档实证存的是「是否启用
#   标题音乐」=1、「标题音乐音量」=66、「冒險者性別」无值，都没有序号。故
#   0/1 是 ere 侧给命名变量分配的落表序号（取空闲低端，自洽即可，旧存档
#   兼容 out of scope）；100 的通信勇者记录是字符串一族合并落表（见该条目
#   前注）。曾经的 98/99（标题画面联系方式/名单开关）已随该画面两段删除。
# 冒險者性別（原文用字，魔改使用.ERH:2）随 #547 收录为「冒险者性别」（id 3，
# 键名按 #60 简体化）：GLOBAL SAVEDATA，@EVENTFIRST 每次开局重置为 -1
# （SYSTEM ver1.0.3.ERB:53），设置页 [27] 六档循环（CONFIG.ERB:253-264）。
#   id 2（音频默认值已落盘）是 ere 侧机制槽（issue #69），非原作变量：原作随包
#   global.sav 预置 是否启用标题音乐=1、标题音乐音量=66，而 ere 引擎全新
#   global.sav 把声明槽位一律置 0（app.asar loadGlobal：缺失/为假的声明槽补
#   0）——「原作发行态」只能由代码一次性播种。该槽即播种标记：1=已按原作
#   默认值落盘过，此后不再播种（用户经设定界面关掉标题音乐后不被覆盖）。
#
# 包装层产物：ere/era-utils/era-global.js（tools/gen-wrapper.js 生成初稿）。
# 各变量在原作中的语义与来源见该文件手写区补注。
"是否启用标题音乐":
  id: 0
  name: "title_music_enabled"
  type: "number"
"标题音乐音量":
  id: 1
  name: "title_music_volume"
  type: "number"
"音频默认值已落盘":
  id: 2
  name: "audio_defaults_seeded"
  type: "number"
"冒险者性别":
  id: 3
  name: "adventurer_gender"
  type: "number"
"通信勇者记录":
  id: 100
  name: "communication_roster"
  type: "string"
