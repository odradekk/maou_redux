# 全局变量表：global 表是公共存档 global.sav 的主体，引擎每次执行脚本前自动
# 加载、伴随特定存档自动保存（dev-guides/11-saves.md）。
#
# 字段形状与引擎自带转换器的产出一致（issue #13）：
#   键    = 中文显示名（#5 决议三层命名的第一层）
#   name  = 英文 snake_case 标识符（JS 侧访问器名）
#   id    = 数字下标，与 Emuera 原下标 1:1（底层寻址一律用它，#5 决议）
#
# 本表为人工产出（issue #18）：target/CSV 没有全局表，变量来自 ERH 的
# #DIM GLOBAL SAVEDATA 声明与 TITLE 的序号直寻。id 分配依据（issue #18 留痕）：
#   命名变量在 Emuera 侧按「名字」存取——target/Sav/global.sav 实证存的是
#   「是否启用标题音乐」=1、「标题音乐音量」=66、「冒險者性別」无值，原作侧
#   没有序号。故 0/1 是 ere 侧给命名变量的落表序号（取空闲低端，自洽即可，
#   旧存档兼容 out of scope）；98/99 则是 TITLE ver1.0.8.ERB 序号直寻的硬事实。
# 未收录：「冒險者性別」（魔改使用.ERH，不在标题路径，留给魔改子系统票）。
#
# 包装层产物：ere/era-utils/era-global.js（tools/gen-wrapper.js 生成初稿）。
# 各变量在原作中的语义与来源见该文件手写区补注。
"是否启用标题音乐":
  id: 0
  name: "title_music_enabled"
  type: "number"
"标题音乐音量":
  id: 1
  name: "title_music_volume"
  type: "number"
"联系方式开关":
  id: 98
  name: "contact_info_shown"
  type: "number"
"致辞折叠开关":
  id: 99
  name: "greeting_collapsed"
  type: "number"
