# EX_FLAG 名字表（issue #113）：原作「魔改版从原版 FLAG 移出的独有旗标」
# （target/ERB/其他/EXCOM.ERH:1 的 #DIM SAVEDATA EX_FLAG,10000）。#5 决议的
# 「自定义一维表」，与 Flag.yml 同为人工产出（原作无 EX_FLAG 名称 CSV，无从
# 转换；先例 Global.yml，issue #18）。
#
# 机制（yml/Audio.yml 同款，app.asar eraStart 实测）：非内建表名落 yml 即
# 注册为扩展普通表，fillData 自动建 data.exflag 桶并把声明槽位置 0；
# saveData 整存、resetData 重建桶——与 #DIM SAVEDATA 的存清语义一致。
# setVar 接受 exflag:99 与 exflag:威望 两种寻址。
#
# 条目范围：#5 决议实测的 34 个实用下标 + 2815/2816 两个槽位，不做超出用点
# 的扩表。逐条语义与证据见各条注释（文件与行号均为 target/ 原作侧）。
#
# 两条已查实的原作缺陷，移植时按本注释处置（不要「修回去」）：
#   - id 101（天神宫侵攻度）：原作 INVASION.ERB:134-135 把 AREA=101 的侵攻度
#     累加进了 FLAG:101，EX_FLAG:101 只有只读显示点（INVASION.ERB:46），
#     无写入点（issue #102 查明）。槽位按原作意图保留。
#   - id 2815/2816：结局线区间在原作被错写进 FLAG 侧（ENDINGDATA.ERB 的
#     【葵希罗】行写 FLAG:2815 = 0、ENDING ver 1.0.1.ERB 的 ENDCHECKMAIN 写
#     FLAG:2816 = 10）；EX_FLAG 侧 ENDCHECK 的动态读
#     EX_FLAG:(2800+LOCAL)（ENDING ver 1.0.1.ERB:347，LOCAL 取 2-15）只达
#     2815。两槽按语义区间登记在案，真值归属由 ENDING_1 演出票决定。
#
# 包装层产物：暂未生成——首个消费者（侵略线各票）落地时由
# tools/gen-wrapper.js 入白名单生成 ere/era-utils/era-exflag.js 初稿。
# 上届魔王的角色号（@MAOU_TENSHIN：EX_FLAG:0 = MASTER，注释「上届魔王记录」，
# EVENT_NEXTDAY.ERB:2458-2459；CHARA_INFO ver1.0.1.ERB:276 名单跳过它）
"上届魔王":
  id: 0
  name: "prev_maou"
  type: "number"
# 指定继任的魔王角色号（@MAOU_KOUFO 选出存入，@MAOU_TENSHIN 据此交接，
# EVENT_NEXTDAY.ERB:2451/2457）
"继任魔王":
  id: 3
  name: "next_maou"
  type: "number"
# 已击破勇者的种族位域（人类|1、精灵|2、龙族|4、…，INVASION_EVENT.ERB:836+）
"勇者击破位域":
  id: 95
  name: "defeated_heroes_bits"
  type: "number"
# 威望。@EVENTFIRST 播种 70，每次侵略 +2（INVASION.ERB）；出兵效率按区间
# 打折（INVASION.ERB:236-255：≤20 侵攻失败、21-40 战斗力÷4、41-60 略受
# 质疑、61-80 相安无事、81-100 广受爱戴）；魔王交接时 -30
"威望":
  id: 99
  name: "prestige"
  type: "number"
# 天神宫侵攻度（0-10000，INVASION.ERB:46 只读显示；写入点被原作错放进
# FLAG:101，见头注）
"天神宫侵攻度":
  id: 101
  name: "shrine_invasion"
  type: "number"
# 天神宫征服阶段（≥1 可巡视、≥4 已征服；唯一写点 INVASION.ERB:136-137）
"天神宫阶段":
  id: 102
  name: "shrine_stage"
  type: "number"
# 嘉德口上会话开关（@EVENTTRAIN #PRI 置 1、@EVENTEND #LATER 清 0，
