# EX_FLAG 名字表（issue #113）：魔改版从原版 FLAG 移出的独有旗标
# （#DIM SAVEDATA EX_FLAG,10000）。#5 决议的「自定义一维表」，与 Flag.yml
# 同为人工产出（先例 Global.yml，issue #18）。
#
# 机制（yml/Audio.yml 同款，app.asar eraStart 实测）：非内建表名落 yml 即
# 注册为扩展普通表，fillData 自动建 data.exflag 桶并把声明槽位置 0；
# saveData 整存、resetData 重建桶——与 #DIM SAVEDATA 的存清语义一致。
# setVar 接受 exflag:99 与 exflag:威望 两种寻址。
#
# 条目范围：#5 决议实测的 34 个实用下标 + 2815/2816 两个槽位，不做超出用点
# 的扩表。逐条语义见各条注释。
#
# 两条已查实的旧实现缺陷，按本注释处置（不要「修回去」）：
#   - id 101（天神宫侵攻度）：地区选择把 AREA 置成 101，而出兵时的累加与
#     封顶写的是 `FLAG:AREA` 即 FLAG:101，EX_FLAG:101 只有只读显示点
#     （征服后菜单、出兵菜单、魔力结果段），无写入点（issue #102 查明）。
#     **#505 补齐的另一半**：另外三处结果段的进度条也只写 `BAR FLAG:AREA`，
#     且 SINDO = 102 让各结果段的已征服判断读 FLAG:102 —— 与 K2 的「口上
#     存在标志」同槽（人数上限阶梯读 FLAG:94 同源）。槽位按既有意图保留；
#     读点的表选择逐处写死在 ere/page/page-invasion.js 的 `region_progress()`
#     调用参数里，原样保留这种不统一。
#   - id 2815/2816：结局线区间被错写进 FLAG 侧（【葵希罗】行写 FLAG:2815 = 0、
#     ENDCHECKMAIN 写 FLAG:2816 = 10）；EX_FLAG 侧 ENDCHECK 的动态读
#     EX_FLAG:(2800+LOCAL)（LOCAL 取 2-15）只达 2815。两槽按语义区间登记
#     在案，真值归属由 ENDING_1 演出票决定。
#
# 包装层产物：暂未生成——首个消费者（侵略线各票）实现时由
# tools/gen-wrapper.js 入白名单生成 ere/era-utils/era-exflag.js 初稿。
# 上届魔王的角色号（event_maou_tenshin：EX_FLAG:0 = MASTER，注释「上届魔王记录」，
# 角色名单跳过它）
"上届魔王":
  id: 0
  name: "prev_maou"
  type: "number"
# 指定继任的魔王角色号（maou_kouho 选出存入，event_maou_tenshin 据此交接）
"继任魔王":
  id: 3
  name: "next_maou"
  type: "number"
# 已击破勇者的种族位域（人类|1、精灵|2、龙族|4、…）
"勇者击破位域":
  id: 95
  name: "defeated_heroes_bits"
  type: "number"
# 威望。EVENTFIRST 播种 70，每次侵略 +2；出兵效率按区间打折
