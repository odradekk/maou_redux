# 本文件为人工产出：EX / NOWEX 的名字表（nowex 也查本表——引擎寻址层
# case"nowex" → staticData.ex）。
#
# 内容：绝顶计数。0–5 与调教状态画面上那一行方括号一一对应（page-train.js
# 的 print_ex_counters）：0 阴蒂（男/扶她体型显示成「阴茎绝顶」，同一个
# 计数器）/ 1 私处 / 2 肛门 / 3 乳房 / 4 癖好（显示名取 CSTR:7）/ 5 射精。
#
# 这张名字表还兼着一件结构上的事：引擎的三段寻址在 `data[表][角色]` 存在、
# 而 `staticData[表]` 缺位时**直接抛错**（app.asar 的 setVar 回落分支
# `u = i(this.staticData[a][u], u)`，无检查）——调教域的表由 beginTrain
# （addCharacterForTrain）按角色开桶，所以桶一定在、崩就崩在名字表这一侧。
# 实机撞见的是 stain 的同类崩溃（见 yml/Stain.yml）。
#
# 更要紧的是：本表登记的序号集就是 'exkeys'，而调教回合开始要按它把入列
# 角色的 NOWEX 逐格清零（ere/system/train/command-round.js 的
# clear_nowex_all）。表空时那个循环拿到的 exkeys 是 []，什么也不清——正常
# 回合的 NOWEX 由引擎的 nextTurnInTrain 结算时清掉，看不出来；**取消的回合**
# （指令返回 0，不结算也不进 nextTurnInTrain）写下的值会漏到下一回合。
#
# 登记的序号会被 beginTrain 按 0 预置进每个调教角色的 ex 与 nowex 桶（槽从
# undefined 变成 0），与上面那个清零的方向一致。ex 与 nowex 两张表在 endTrain
# 时整表删除、不进存档，登记与否都不影响旧存档。
