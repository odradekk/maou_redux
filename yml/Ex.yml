# 本文件为人工产出：EX / NOWEX 没有名字表（游戏侧一律用数字下标）。
#
# 内容：绝顶计数。**nowex 也查本表**（引擎寻址层：case"nowex" → staticData.ex）。下标全是数字（SHOW_STATUS 用 EX:0 阴蒂·阴茎 / 1 私处 / 2 肛门 / 3 乳房 / 4 %CSTR:7% / 5 射精·喷乳）。
#
# 它的存在只有一个目的：让引擎装载循环建出 `staticData.ex`。引擎的
# 三段寻址在 `data[表][角色]` 存在、而 `staticData[表]` 缺位时**直接抛错**
# （app.asar 的 setVar 回落分支 `u = i(this.staticData[a][u], u)`，无检查）——
# 调教域的表由 beginTrain（addCharacterForTrain）按角色开桶，所以桶一定在、
# 崩就崩在名字表这一侧。实机撞见：调教开始时写 `stain:31:2` 报
# `Cannot read properties of undefined (reading '2')`。
#
# 空表即够用：下标是数字，引擎的 safeUndefinedCheck 在名字表查不到时原样
# 回落到该数字。将来若要按名寻址，在此补「名称: 序号」条目即可——但注意
# 本表不在 initCharaTable（abl / talent / cflag / equip / mark / exp / juel）
# 里，登记的序号由 beginTrain 的 addCharacterForTrain 按 0 预置进每个调教
# 角色的 ex 与 nowex 桶（nowex 查的就是本表），槽从 undefined 变成 0，行为
# 随之改变，补之前先确认那是想要的。
