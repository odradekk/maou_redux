# 魔改 SAVEDATA 变量表（issue #547）：「魔改新增/魔改使用」里
# #DIM SAVEDATA（随游戏存档、非 GLOBAL）一族的 ere 落点。与同文件的 GLOBAL
# 支不同类：冒險者性別（原文用字）是 GLOBAL SAVEDATA，走公共存档跨局共享，
# 落 yml/Global.yml id 3；本表收随 saveData/resetData 存清的单档变量——引擎侧
# 由扩展普通表自动承载（先例 yml/Audio.yml，issue #69：app.asar eraStart 对
# 非内建表名登记 tableType.normal，fillData 自动建 data 桶并把声明槽位置 0；
# saveData 整存 this.data、resetData 重建桶——存清语义与 #DIM SAVEDATA 一致）。
#
# 本表为人工产出（先例：Global.yml #18、Audio.yml #69）。
# 条目与 id 分配（#547；旧引擎侧命名变量按名字存取、无序号，ere 侧取空闲
# 低端自洽即可）：
#   id 0 = 卖淫影响（无声明默认值 → 新档 0 = 负面，「（默认设置）」的注释
#   印证）。写点：设置页 [29] 档位 0→1→2 循环；读点：素质自动提升 37 的
#   跳过档、卖角色估价倍率、设置页 [29] 档位文案。
#   id 1 = 反作弊（无声明默认值 → 新档 0）。写点：设置页 [30] 翻 0/1；
#   读点：日循环里 `SIF !反作弊` → CALL DEBUG_CHECK（反作弊 1 = 关闭检查，
#   可开修改）。
# 未收录：立绘（#542 判不移植）、NO_SP（SP 图像开关，立绘同判）、
# 赤森奴隶（非 SAVEDATA 的普通 #DIM，无存档语义）。
#
# 包装层产物：ere/era-utils/era-modsave.js（tools/gen-wrapper.js 生成初稿）。
# 各变量的语义与来源见该文件手写区补注。
"卖淫影响":
  id: 0
  name: "prostitution_effect"
  type: "number"
"反作弊":
  id: 1
  name: "anti_cheat"
  type: "number"
