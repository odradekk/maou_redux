# flag 表：旧引擎内置 FLAG 数组 + 并入 flag 的旧引擎内置变量（#5 决议）。
#
# id 分配约定（两层，互不重叠）：
#   - FLAG:N 条目沿用既有下标落表（实用下标 104 个、最大 9001，随各
#     子系统票渐进声明——已立：调教路径（#44）、侵略线（#113，9/81/82/
#     86-91/400/502））；
#   - 10000 起为保留区：ere 无对应表的旧引擎内置变量并入 flag（DAY/TIME/
#     MONEY）与角色指针占 flag 槽位（TARGET/ASSI，ere-kanon 同做法，#5
#     决议第六条）。FLAG 实用下标最大 9001，10000 起无撞号风险。
#
# 本表为人工产出（与 Global.yml 同一先例，issue #18）：没有现成的 flag 名表，
# flag 语义只散见于旧代码注释与游戏内 flag 说明文档。
# 包装层产物：ere/era-utils/era-flag.js（tools/gen-wrapper.js 生成初稿）。
# 各变量的语义与来源见该文件手写区补注。
#
# —— 侵略线一段（issue #113，语义依据逐条注明）——
# 魔王特别税加成（百分比）：主菜单「休息」每次 +5，
# 征税时 TAX:3 = TAX:0 × (本值 + 100) / 100 − TAX:0，征毕清零
"特别税加成":
  id: 9
  name: "tax_surcharge"
  type: "number"
# 人间界侵攻度（0-10000）。出兵累加（AREA 循环）、每日自然衰减 RAND:100；
# ≥10000 触发 ENDING_1；税单按 /10 折殖民地数
"人间界侵攻度":
  id: 81
  name: "human_realm_invasion"
  type: "number"
# ENDING_1（魔王掌握世界）已演出标记：演出内置 1，
# 亦是「人间界已陷落」的世界状态读点（闲聊差分、勇者数量检查）
"人间界陷落":
  id: 82
  name: "human_realm_fallen"
  type: "number"
# 人间界侵略事件进度（kyoten_event 的状态机）：
# 0=未占、1=占村、2=占港、3=陷堡垒、4=占街道、5=占城市；侵攻度回落时按档
# 回退。角色线读数点：嘉德线判定 == 3
"人间界侵略事件进度":
  id: 93
  name: "human_realm_event_stage"
  type: "number"
# 精灵族领域侵攻度（衰减与税单同 FLAG:81 型）；满值触发 ENDING_3
"精灵领域侵攻度":
