# —— 补登：源码在用但未登记的序号（issue #830）——
#
# 本段每一行都是「源码按字面量下标读写、Flag.yml 没有条目」的序号。名字来自
# tools/facade-names.js；其中 6 / 34 / 40 / 48 / 70 / 72 / 73 / 75 / 77 / 402 /
# 614 十一个原本两处都没有名字，随本票补进那份命名表（语义依据写在各自条目
# 上方的注释里）。中文键与命名表逐条一致，test/train-table-names.test.js 守着
# 「源码用到的 flag 序号都在这里」。
#
# 登记会改变引擎行为：fillData（resetData 与 loadData 共用）对**已声明**的
# 序号赋 0——`this.data.flag[e] ?? (this.data.flag[e] = 0)`——未声明的一直是
# undefined。可观察的差异有两类：
#
#   1. add：`undefined + n` = NaN。flag 侧全库唯一的 add 是 FLAG:60（勇者基础
#      等级修正，enter-enemy 给勇者调等级前先加一），登记前第一次累加就是
#      NaN 并写进存档（JSON 里序列化成 null），此后每次读都拿到 NaN；
#   2. 其余读取点一律 `|| 0`（含 game.<域> 门面 getter）或真假 / 大小 / 位掩码
#      判断，undefined 与 0 在这两种写法下同值。逐序号的读取点核对见 #830 的
#      PR 正文（70 个序号、486 个读点逐类统计）。严格比较只有一处会变：
#      FLAG:62 的 `=== 0`（kojo-k0-tender 的肉便器口上分派）——而 FLAG:62 在同一
#      流程里、读取之前必被写 -1 或 0-12（benki.js 的 run_benki 与
#      choose_benki_dispatch），实机的分支归属不变。
#
# 旧档：0.1.0 的存档里这些键一格都没有，loadData → fillData 会把它们补成 0，
# 上面两类读取行为随之不变；已写过的序号保留存档里的值。存档形状会多出这些
# 键，但读旧档不丢信息，按 ADR-0006 不需要抬【版本】。
# 0 休息：回合结算尾把休息标志复位成 0（event-turnend）。置位方（EVENTSHOP
# 的「休息」）尚未移植，当前全库只有这一处写、只有门面一处读
"休息":
  id: 0
  name: "rest"
  type: "number"
