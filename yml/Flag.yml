  name: "elf_realm_invasion"
  type: "number"
# 精灵领域征服标记：ENDING_3 演出前置 =1、献上圣女（CHAR_GIFT）毕 =2
# ；按三区征服数限勇者
"精灵领域征服":
  id: 87
  name: "elf_realm_conquered"
  type: "number"
# 龙之山脉侵攻度；满值触发
# ENDING_4
