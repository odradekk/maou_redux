# —— 触手族的回合计数（#835：旧引擎的 T:0 并入保留区）——
# 触手类指令与装备持续位共用的累计器：触手指令开始与结束时清 0，
# 持着触手口辱（108）时每回合 +1，触手（100）读到后折成触手经验（EXP:55）
# 并清 0。跨回合、不跨命令——存量最多是「尚未折成经验的几次计数」。
#
# 取 10030 而不是 10029：**10029 是退役槽，不得复用**。它曾是「购入品指针」
# （BOUGHT 的并入落点，v0.1.0–v0.1.5 都在写），#867 改成局部量后才空出来；
# 已发布版本的存档里可能留着最后一次购买的道具序号，复用它会让旧档读出一个
# 陈旧值（ADR-0006 判定表：新增序号不破坏存档，复用旧序号才是破坏）。10030
# 在仓库历史里从未被写过（`git log --all -S "flag:10030"` 为空）。
"触手回合计数":
  id: 10030
  name: "tentacle_round"
  type: "number"
