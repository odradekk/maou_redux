# 本文件登记角色预设（Chara*.yml 的「フラグ」「CFLAG」行）用到的 CFLAG 序号。
#
# 登记有两层作用，缺一不可：
#   1. 让引擎装载循环建出 staticData.cflag——缺这个表时角色预设行整行丢弃并
#      报「角色数据表不存在: cflag!」；
#   2. 让引擎把预设值真正写进角色数据。addCharacter 与读档后的 fillData 都只
#      处理**名字表内登记的下标**（initCharaTable 的
#      ["abl","talent","cflag","equip","mark","exp","juel"] 分支），没登记的
#      序号上的预设一律丢弃。本表此前是空表，44 个角色文件里 222 个非零 CFLAG
#      预设值全部丢掉了：狂王（34）加入后等级、基础攻防、初始装备都是 0。
#
# 字段形状与引擎自带转换器的产出一致（同 Base.yml / PortCFlag.yml 先例）：
#   键    = 中文显示名（对上变量释文，与门面的 cflag 名一致）
#   name  = 英文 snake_case 标识符（JS 侧访问器名）
#   id    = 数字下标，沿用旧引擎的原下标（底层寻址一律用它）
#   type  = 值类型（本表全是整数）
#
# 收录判据是「有角色预设在用」，不是「代码在用」：没有预设、只由代码读写的
# 序号不登记——登记会让引擎在该序号上给每个角色建槽、读档时补值，初值语义
# 随之变化。反过来，登记之后删条目会让旧档里那批槽停在原值，不要删。
#
# 例外的第二类：**要跨过调教窗口留存**的代码自有槽。调教期专表随 endTrain
# 整表删除，日循环里要读到调教结束时的值，就得先落进不被删除的表；登记这类
# 槽是为了让门面访问器与存档里的槽位一致，条目自带说明（调教后欲情）。
#
# 读档影响：引擎读档时 fillData 把登记序号的预设补进旧存档里从未写过的槽。
# 绝大多数据点在读之前都先写（加入点显式设值班、每日重算攻防、生成身体数据
# 等），补进来的预设只是把角色还原成角色文件描述的样子；唯一注意点是状态位
# 1——原版 0 = 調教中、1 = 待機、2 = 侵攻中，移植版一律用 0 表示「在城里可
# 操作」，所以那 39 个角色的预设 1/2 与本移植版的状态模型语义不同。逐序号的
# 核对结论见 #814 的 PR 说明。
