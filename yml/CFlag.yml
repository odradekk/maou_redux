#
# **登记改变了引擎行为**：fillData（resetData / loadData 共用）与 addCharacter
# 都只处理名字表里登记的下标——登记后，每个已加入角色（含旧档读出来的）都会
# 多出这些槽，值取角色预设、没有预设则 0。因此：
#
#   1. 存档会变大：一个角色多 179 格键（实测数字见 #831 的 PR 正文）；
#      saveCompressedData 为 false，进档的是明文 JSON。
#   2. add 类写入从 NaN 变成数字：undefined 加 n 得 NaN，登记后从 0 起算。
#      本批里受影响的写点是 cflag:31 / 81 / 82 / 106 / 107 / 666（逐条见各段）。
#   3. 读取侧绝大多数是「|| 0」「?? 0」（1272 处）或门面 getter 的「|| 0」
#      （210 处），undefined 与 0 在这两种写法下同值；真值判断、与 0 以外常量
#      比较、位运算同样与 0 同结论。严格比较里「!== 0」「!= 0」一处都没有；
#      「=== 0」有六处，逐条核对见 #831 的 PR 正文——其中 504（两处）与
#      650（一处）由「恒假」变成「可命中」，这正是原作 CFLAG 全表预置 0 时
#      该走的那一支。
#
# 不登记的那批见文件末的「无名位」说明（#831 时 43 个，#982 补名后剩 2 个）。

