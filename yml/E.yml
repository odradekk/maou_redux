# E 表：怪物战斗状态区（issue #175，阶段 3 H6）。
#
# 源: target/ERB/怪物相關/MONSTER_DATA.ERB 文头 :26-57 的布局说明（逐条照抄）
#     + target/CSV/VariableSize.csv:63（E,100000——Emuera 单字母全局数组）。
#
# Emuera 的 E 是单字母全局数组（纯数字下标、无名字表、全区初始 0、随存档
# 落盘）。EraElectron 的 data 桶清单（app.asar resetData）没有单字母表——
# 本文件让引擎按「开发者自定义一维表」建 data.e 桶（dev-guides/09-static.md
# 「引擎会自动识别、读取并以一维表方式初始化自定义表」；装载器把非内置
# 表标为 tableType.normal，fillData 建桶并给声明条目补 0）。游戏代码一律
# 数字下标寻址（`era.get('e:99')`，未声明下标回落数字、读侧 getter 兜 0），
# 条目名只承载布局语义，1:1 于原作「全区 0 起步、战斗期写入」。
#
# 五列布局（组距 100；写者 @MONSTER_DATA，读者 @DUNGEON_PARTY_BATTLE 等）：
#   E:  0- 99 == 第 1 列（防御怪物）
#   E:100-199 == 第 2 列（防御怪物）
#   E:200-299 == 第 3 列（防御怪物）
#   E:300-399 == 勇者(A)配下（LINE == 3）
#   E:400-499 == 勇者(T)配下（LINE == 4）
# 每列内（Y = 列头；源 :37-57 照抄）：
#   E:Y     == 怪物番号    E:Y+1  == 等级
#   E:Y+2   == 攻击力      E:Y+3  == 防御力
#   E:Y+4   == 速度        E:Y+5  == 特殊
#   E:Y+6   == 魔法        E:Y+7  == 凌辱类型
#   E:Y+8   == Boss 化标志 E:Y+9  == 状态异常（位 0:毒 / 位 1:火炎…）
#   E:Y+10  == 耐性（位 0:火炎 / 1:冷气 / 2:电击）
#   E:Y+99  == 怪物数
# E:500-599 == 结婚·凌辱（随凌辱票，本表不预声明）
