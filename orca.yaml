# Orca worktree hooks —— 官方文档：https://www.onorca.dev/docs/agents/hooks-memory
# 键名依据：orca 源码 src/shared/orca-yaml-hook-types.ts（scripts.setup / scripts.archive）
# 注意：Windows 上 setup 逐行经 cmd 的 call 运行，不能写 if/for 等控制流（已实测）

scripts:
  # 设置脚本：worktree 创建后运行，工作目录 = 新 worktree 根目录
  # 本项目只需要：验证 Node + 安装 devDependencies（node_modules 是 gitignored）
  setup: |
    node --version
    npm ci
    echo Orca setup done in %ORCA_WORKTREE_PATH%

  # 存档脚本：worktree 归档/删除前运行，工作目录 = 被归档的 worktree
  # 把 worktree 里 gitignored 的本地产物备份到主 checkout 的 .orca-archive/<worktree名>/
  # 注意：Windows 上 archive 经 Node exec + cmd /c 直跑，多行内联脚本只执行第一行（已实测），
  # 因此这里必须是单行，实际逻辑在入库的 scripts/orca-archive.cmd（归档时 worktree 仍在，可被调用）
  archive: call scripts\orca-archive.cmd
